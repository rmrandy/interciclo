<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Simple API</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        button { padding: 10px; margin: 5px; }
        pre { background: #f8f9fa; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🧪 Prueba Simple de la API</h1>
    
    <div class="test">
        <h3>1. Health Check</h3>
        <button onclick="testHealth()">Probar /api/health</button>
        <div id="healthResult"></div>
    </div>

    <div class="test">
        <h3>2. API de Ciudades</h3>
        <button onclick="testCities()">Probar /api/airline/cities</button>
        <div id="citiesResult"></div>
    </div>

    <div class="test">
        <h3>3. API de Vuelos</h3>
        <button onclick="testFlights()">Probar /api/airline/flights</button>
        <div id="flightsResult"></div>
    </div>

    <script>
        const API_BASE = 'http://192.168.0.10:8080';

        async function testHealth() {
            const result = document.getElementById('healthResult');
            try {
                const response = await fetch(`${API_BASE}/api/health`);
                const data = await response.json();
                result.className = 'success';
                result.innerHTML = `<pre>✅ Éxito: ${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                result.className = 'error';
                result.innerHTML = `<pre>❌ Error: ${error.message}</pre>`;
            }
        }

        async function testCities() {
            const result = document.getElementById('citiesResult');
            try {
                const response = await fetch(`${API_BASE}/api/airline/cities`);
                const data = await response.json();
                result.className = 'success';
                result.innerHTML = `<pre>✅ Éxito: ${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                result.className = 'error';
                result.innerHTML = `<pre>❌ Error: ${error.message}</pre>`;
            }
        }

        async function testFlights() {
            const result = document.getElementById('flightsResult');
            try {
                const response = await fetch(`${API_BASE}/api/airline/flights`);
                const data = await response.json();
                result.className = 'success';
                result.innerHTML = `<pre>✅ Éxito: ${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                result.className = 'error';
                result.innerHTML = `<pre>❌ Error: ${error.message}</pre>`;
            }
        }
    </script>
</body>
</html>
